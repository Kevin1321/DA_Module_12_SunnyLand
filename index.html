<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnyLand</title>
    <link rel="shortcut icon" href="assets/sprites/characters/Foxy/Victory/Victory.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/colors.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="style.css">

    <script src="scripts/engine/animation.js"></script>
    <script src="scripts/engine/audio-manager.js"></script>
    <script src="scripts/engine/audio-assets.js"></script>
    <script src="scripts/engine/collision-layers.js"></script>
    <script src="scripts/engine/game-object.js"></script>
    <script src="scripts/engine/ui-object.js"></script>
    <script src="scripts/engine/input-manager.js"></script>
    <script src="scripts/engine/sprite-assets.js"></script>
    <script src="scripts/engine/util.js"></script>

    <script src="scripts/game-objects/characters/character.js"></script>
    <script src="scripts/game-objects/characters/player/player-animator.js"></script>
    <script src="scripts/game-objects/characters/player/projectile.js"></script>
    <script src="scripts/game-objects/characters/player/player.js"></script>
    <script src="scripts/game-objects/characters/enemies/enemy.js"></script>
    <script src="scripts/game-objects/characters/enemies/boss.js"></script>
    <script src="scripts/game-objects/characters/enemies/minion.js"></script>

    <script src="scripts/game-objects/static-objects/background.js"></script>
    <script src="scripts/game-objects/static-objects/level.js"></script>
    <script src="scripts/game-objects/static-objects/prop.js"></script>
    <script src="scripts/game-objects/static-objects/goal.js"></script>

    <script src="scripts/game-objects/static-objects/pick-ups/pick-up.js"></script>
    <script src="scripts/game-objects/static-objects/pick-ups/cherry.js"></script>
    <script src="scripts/game-objects/static-objects/pick-ups/gem.js"></script>

    <script src="scripts/ui-objects/player-hud.js"></script>

    <script src="scripts/engine/world.js"></script>
    <script src="scripts/modal.js"></script>
    <script src="scripts/main.js"></script>
</head>

<body onload="main()">
    <div id="portrait-overlay">
        <div id="portrait-overlay-content">
            <span id="portrait-icon">📱</span>
            <p>Bitte drehe dein Gerät ins <strong>Querformat</strong></p>
        </div>
    </div>
    <header>
        <h1>Sunny Land</h1>
    </header>

    <main>
        <div class="background-layer-one">
            <div class="background-layer-two">

                <div id="game-controls">
                    <div id="audio-controls">
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.1"
                            oninput="AudioManager.SetVolume(parseFloat(this.value))">
                        <img id="mute-btn" src="assets/sprites/UI/audio-enabled.png"
                            onclick="AudioManager.ToggleMute()">
                        <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
                        <button id="touch-toggle-btn" onclick="toggleTouchControls()">✋</button>
                    </div>
                </div>

                <div id="canvas-container">
                    <canvas id="game-canvas" width="720" height="480"></canvas>
                    <div id="game-overlay">
                        <div id="game-banner"></div>
                        <button id="start-btn" onclick="startGame()">▶ Start</button>
                    </div>

                    <!-- Fullscreen UI -->
                    <div id="fullscreen-audio">
                        <input type="range" id="fs-volume-slider" min="0" max="1" step="0.01" value="0.1"
                            oninput="AudioManager.SetVolume(parseFloat(this.value))">
                        <img id="fs-mute-btn" src="assets/sprites/UI/audio-enabled.png"
                            onclick="AudioManager.ToggleMute()">
                        <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
                        <button id="touch-toggle-btn" onclick="toggleTouchControls()">✋</button>
                    </div>

                    <div id="fullscreen-controls">
                        <div class="fs-btn-group">
                            <button class="fs-btn" id="btn-left" onpointerdown="InputManager.LEFT = true"
                                onpointerup="InputManager.LEFT = false">◀</button>
                            <button class="fs-btn" id="btn-right" onpointerdown="InputManager.RIGHT = true"
                                onpointerup="InputManager.RIGHT = false">▶</button>
                        </div>
                        <div class="fs-btn-group">
                            <button class="fs-btn" id="btn-jump" onpointerdown="InputManager.JUMP = true"
                                onpointerup="InputManager.JUMP = false">▲</button>
                            <button class="fs-btn" id="btn-shoot" onpointerdown="InputManager.SHOOT = true"
                                onpointerup="InputManager.SHOOT = false">⭐</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <p onclick="openModal('howToPlay')">How to play</p>
        <p onclick="openModal('licences')">Licences</p>
        <p onclick="openModal('imprint')">Imprint</p>
    </footer>

    <div id="modal-overlay" onclick="closeModal()">
        <div id="modal" onclick="event.stopPropagation()">
            <div id="modal-header">
                <button id="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-text"></div>
        </div>
    </div>

</body>

</html>
